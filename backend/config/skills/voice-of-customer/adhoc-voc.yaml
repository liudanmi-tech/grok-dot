name: voice-of-customer/adhoc-voc
version: 1.0.0
owner: agent-ops-lagos
bots: [voice-of-customer]
description: 人工下达的售后问题分析
steps:
  - id: tickets
    title: 查询近 28 天售后工单
    type: tool
    tool: carlcare-tickets.query_tickets
    args: { days: 28 }
    est_minutes: 1
  - id: answer
    title: 分析并给出结论
    type: llm
    task_type: analyze
    data_class: internal
    output: true
    est_minutes: 3
    system: 你是用户声音分析员。只依据给定工单数据回答，区分【事实】与【推断】。
    prompt: |
      任务：{{goal}}
      工单统计：{{steps.tickets.result|json}}
