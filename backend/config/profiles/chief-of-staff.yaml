id: chief-of-staff
display_name: 总调度
owner: agent-ops-lagos
business_owner: u-country-manager
service_account: svc-bot-chief-of-staff
status: staging
scope: { country: [NG] }
triggers: []
# 总调度本身不碰业务数据：只负责拆解、分派、跟进、汇总。数据由各成员在各自权限内取。
tools:
  - knowledge.search
  - notify.notify_internal
  - memory.propose
outputs:
  - { channel: feishu, to: group:ng-management }
default_skill: coordinate
limits: { max_run_minutes: 60, max_tool_calls_per_run: 20, max_model_tokens_per_run: 500000 }
memory: { namespace: bot/chief-of-staff, summary_ttl_days: 90 }
browser: false
