id: field-reporter
display_name: 一线日报员
owner: agent-ops-lagos
business_owner: u-country-manager
service_account: svc-bot-field-reporter
status: staging
scope: { country: [NG] }
triggers: []
# 促销员在 WhatsApp 报数由平台即时处理（app/field_reports.py）；这里的技能用于回答「今天一线报了多少」之类的问题
tools:
  - field-reports.query_summary
  - sales-data.query_sell_through
  - memory.propose
outputs:
  - { channel: feishu, to: group:channel-team }
default_skill: adhoc-field
limits: { max_run_minutes: 10, max_tool_calls_per_run: 20, max_model_tokens_per_run: 500000 }
browser: false
